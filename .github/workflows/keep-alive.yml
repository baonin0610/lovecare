name: 24/7 Keep Awake Ping

on:
  schedule:
    # Runs every 10 minutes to prevent free tier servers from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Server
        run: |
          TARGET_URL="${{ secrets.APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://lovecare-lo5w.onrender.com"
          fi
          echo "Pinging $TARGET_URL/api/ping..."
          curl -s -f "$TARGET_URL/api/ping" || true
          echo "Keep-alive ping sent successfully!"
