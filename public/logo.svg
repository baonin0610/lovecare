<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8DA1"/>
      <stop offset="100%" stop-color="#FF5277"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AEE9F8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E11D48" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle heart bubble background -->
  <circle cx="120" cy="140" r="28" fill="white" opacity="0.2"/>
  <circle cx="410" cy="180" r="18" fill="white" opacity="0.25"/>
  <circle cx="390" cy="100" r="32" fill="white" opacity="0.15"/>

  <!-- Main Water Droplet Character -->
  <g filter="url(#shadow)">
    <!-- Droplet Body -->
    <path d="M 256,100 C 256,100 130,250 130,330 C 130,400 186,456 256,456 C 326,456 382,400 382,330 C 382,250 256,100 256,100 Z" fill="url(#waterGrad)"/>
    
    <!-- Droplet Shine -->
    <path d="M 210,180 C 180,220 160,270 160,320 C 160,340 166,355 174,360 C 170,335 175,290 205,230 C 215,210 225,195 210,180 Z" fill="white" opacity="0.4"/>
    <circle cx="210" cy="200" r="14" fill="white" opacity="0.6"/>

    <!-- Cute Eyes -->
    <ellipse cx="216" cy="320" rx="10" ry="14" fill="#0F172A"/>
    <ellipse cx="296" cy="320" rx="10" ry="14" fill="#0F172A"/>
    
    <!-- Eye Sparkles -->
    <circle cx="213" cy="315" r="4.5" fill="white"/>
    <circle cx="293" cy="315" r="4.5" fill="white"/>
    <circle cx="219" cy="324" r="2" fill="white"/>
    <circle cx="299" cy="324" r="2" fill="white"/>

    <!-- Cute Cheeks -->
    <ellipse cx="186" cy="336" rx="14" ry="9" fill="#FF4D6D" opacity="0.4"/>
    <ellipse cx="326" cy="336" rx="14" ry="9" fill="#FF4D6D" opacity="0.4"/>

    <!-- Happy Smile -->
    <path d="M 238,338 Q 256,360 274,338" stroke="#0F172A" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating Heart Badge -->
  <g transform="translate(320, 260)">
    <circle cx="40" cy="40" r="36" fill="#FFF" filter="url(#shadow)"/>
    <path d="M 40,56 C 24,44 18,36 18,28 C 18,20 24,14 32,14 C 36,14 40,17 40,17 C 40,17 44,14 48,14 C 56,14 62,20 62,28 C 62,36 56,44 40,56 Z" fill="#FF2E63"/>
  </g>
</svg>
